<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 进程管理</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="light.css" id="theme-css" />
</head>
<body>
  <!-- 公共头部 -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-box">P</div>
      <h1 class="app-title">进程管理</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="density-toggle" title="切换密度模式">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M3 17h18v-2H3v2zm0 3h18v-1H3v1zm0-7h18v-3H3v3zm0-9v4h18V4H3z"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-toggle" title="切换主题">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 登录表单区域 -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">P</div>
        <h2 class="login-title">欢迎回来</h2>
        <p class="login-subtitle">请登录您的账户以继续</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label class="input-label" for="username">用户名</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="请输入用户名"
            required
          />
        </div>

        <div class="input-group">
          <label class="input-label" for="password">密码</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="请输入密码"
            required
          />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">记住我</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          登录
        </button>
      </form>
    </div>
  </div>

  <script>
    // ===========================
    // 主题切换逻辑 (与 index.html 相同)
    // ===========================
    const themeToggle = document.getElementById('theme-toggle');
    const densityToggle = document.getElementById('density-toggle');
    const themeCss = document.getElementById('theme-css');

    function initTheme() {
      const savedTheme = localStorage.getItem('pm-theme');
      const savedDensity = localStorage.getItem('pm-density');
      
      if (savedTheme === 'dark') {
        themeCss.href = 'dark.css';
        themeToggle.classList.add('active');
      } else {
        themeCss.href = 'light.css';
        themeToggle.classList.remove('active');
      }

      if (savedDensity === 'comfortable') {
        document.body.classList.add('mode-comfortable');
        densityToggle.classList.add('active');
      } else {
        document.body.classList.remove('mode-comfortable');
        densityToggle.classList.remove('active');
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = themeCss.getAttribute('href') === 'dark.css';
      if (isDark) {
        themeCss.href = 'light.css';
        themeToggle.classList.remove('active');
        localStorage.setItem('pm-theme', 'light');
      } else {
        themeCss.href = 'dark.css';
        themeToggle.classList.add('active');
        localStorage.setItem('pm-theme', 'dark');
      }
    });

    densityToggle.addEventListener('click', () => {
      const isComfortable = document.body.classList.contains('mode-comfortable');
      if (isComfortable) {
        document.body.classList.remove('mode-comfortable');
        densityToggle.classList.remove('active');
        localStorage.setItem('pm-density', 'compact');
      } else {
        document.body.classList.add('mode-comfortable');
        densityToggle.classList.add('active');
        localStorage.setItem('pm-density', 'comfortable');
      }
    });

    // 登录表单处理
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // 模拟登录验证
      if (username && password) {
        alert(`登录成功！欢迎 ${username}`);
        window.location.href = 'index.html';
      }
    });

    initTheme();
  </script>
</body>
</html>
