<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 进程管理</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="light.css" id="theme-css" />
  <!-- 引入 Remix Icon 图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <!-- 公共头部 -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-box">P</div>
      <h1 class="app-title">进程管理</h1>
    </div>
    <div class="header-right">
      <!-- 密度切换 Tab -->
      <div class="density-tab">
        <button class="tab-btn active" data-density="compact" title="紧凑模式">
          <i class="ri-layout-grid-fill"></i>
        </button>
        <button class="tab-btn" data-density="comfortable" title="舒适模式">
          <i class="ri-layout-masonry-fill"></i>
        </button>
      </div>
      <!-- 主题切换按钮 -->
      <button class="icon-btn theme-btn" id="theme-toggle" title="切换主题">
        <i class="ri-sun-line" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- 登录表单区域 -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">P</div>
        <h2 class="login-title">欢迎回来</h2>
        <p class="login-subtitle">请登录您的账户以继续</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label class="input-label" for="phone">手机号码</label>
          <div class="input-with-btn">
            <input 
              type="tel" 
              id="phone" 
              class="form-input" 
              placeholder="请输入11位手机号码"
              maxlength="11"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="code">验证码</label>
          <div class="input-with-btn">
            <input 
              type="text" 
              id="code" 
              class="form-input" 
              placeholder="请输入6位验证码"
              maxlength="6"
              required
            />
            <button type="button" class="btn-code" id="send-code-btn">获取验证码</button>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">记住我</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          登录
        </button>
      </form>
    </div>
  </div>

  <script>
    // ===========================
    // 主题切换逻辑
    // ===========================
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeCss = document.getElementById('theme-css');
    const densityTabs = document.querySelectorAll('[data-density]');

    function initTheme() {
      const savedTheme = localStorage.getItem('pm-theme');
      const savedDensity = localStorage.getItem('pm-density');
      
      // 初始化主题
      if (savedTheme === 'dark') {
        themeCss.href = 'dark.css';
        themeIcon.className = 'ri-moon-line';
        themeToggle.classList.add('active');
      } else {
        themeCss.href = 'light.css';
        themeIcon.className = 'ri-sun-line';
        themeToggle.classList.remove('active');
      }

      // 初始化密度模式
      if (savedDensity === 'comfortable') {
        document.body.classList.add('mode-comfortable');
        densityTabs.forEach(tab => {
          if (tab.dataset.density === 'comfortable') {
            tab.classList.add('active');
          } else {
            tab.classList.remove('active');
          }
        });
      } else {
        document.body.classList.remove('mode-comfortable');
        densityTabs.forEach(tab => {
          if (tab.dataset.density === 'compact') {
            tab.classList.add('active');
          } else {
            tab.classList.remove('active');
          }
        });
      }
    }

    // 主题切换
    themeToggle.addEventListener('click', () => {
      const isDark = themeCss.getAttribute('href') === 'dark.css';
      if (isDark) {
        themeCss.href = 'light.css';
        themeIcon.className = 'ri-sun-line';
        themeToggle.classList.remove('active');
        localStorage.setItem('pm-theme', 'light');
      } else {
        themeCss.href = 'dark.css';
        themeIcon.className = 'ri-moon-line';
        themeToggle.classList.add('active');
        localStorage.setItem('pm-theme', 'dark');
      }
    });

    // 密度模式切换 (Tab 方式)
    densityTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const density = tab.dataset.density;
        
        // 更新 Tab 状态
        densityTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // 应用密度模式
        if (density === 'comfortable') {
          document.body.classList.add('mode-comfortable');
          localStorage.setItem('pm-density', 'comfortable');
        } else {
          document.body.classList.remove('mode-comfortable');
          localStorage.setItem('pm-density', 'compact');
        }
      });
    });

    // 验证码发送逻辑
    const sendCodeBtn = document.getElementById('send-code-btn');
    let countdown = 0;
    
    sendCodeBtn.addEventListener('click', () => {
      const phone = document.getElementById('phone').value;
      
      // 简单验证手机号格式
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入有效的手机号码');
        return;
      }
      
      // 模拟发送验证码
      if (countdown <= 0) {
        countdown = 60;
        sendCodeBtn.disabled = true;
        sendCodeBtn.textContent = `${countdown}s 后重发`;
        
        const timer = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            sendCodeBtn.textContent = `${countdown}s 后重发`;
          } else {
            clearInterval(timer);
            sendCodeBtn.disabled = false;
            sendCodeBtn.textContent = '获取验证码';
          }
        }, 1000);
        
        alert(`验证码已发送至 ${phone} (模拟：123456)`);
      }
    });

    // 登录表单处理
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const code = document.getElementById('code').value;
      
      // 模拟登录验证
      if (phone && code) {
        alert(`登录成功！手机号：${phone}`);
        window.location.href = 'index.html';
      }
    });

    initTheme();
  </script>
</body>
</html>
